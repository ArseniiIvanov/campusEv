<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a2e35">
  <title>Мероприятие — CampusEvents</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%233b6fd8'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="appHeader"></div>

  <main id="eventPage">
    <div class="container py-5 text-center text-body-secondary" id="eventLoading">
      <span class="spinner-border" role="status"><span class="visually-hidden">Загрузка…</span></span>
    </div>
  </main>

  <!-- Результат регистрации -->
  <div class="modal fade" id="registrationModal" tabindex="-1" aria-labelledby="registrationModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4">
        <div class="modal-body text-center p-4 p-md-5" id="registrationModalBody"></div>
      </div>
    </div>
  </div>

  <!-- Подтверждение отмены -->
  <div class="modal fade" id="cancelModal" tabindex="-1" aria-labelledby="cancelModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 rounded-4">
        <div class="modal-body p-4 text-center">
          <i class="bi bi-question-circle fs-1 text-warning"></i>
          <h2 class="h5 mt-2" id="cancelModalTitle">Отменить регистрацию?</h2>
          <p class="small text-body-secondary">Ваше место перейдёт следующему участнику из листа ожидания.</p>
          <div class="d-grid gap-2">
            <button class="btn btn-danger" type="button" id="confirmCancelBtn">Да, отменить</button>
            <button class="btn btn-light" type="button" data-bs-dismiss="modal">Оставить</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="appFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/event.js"></script>
</body>
</html>
