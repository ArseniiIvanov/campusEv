<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a2e35">
  <title>Каталог мероприятий — CampusEvents</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%233b6fd8'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="appHeader"></div>

  <main>
    <header class="page-header py-4 mb-4">
      <div class="container">
        <nav aria-label="Навигационная цепочка">
          <ol class="breadcrumb small mb-2">
            <li class="breadcrumb-item"><a href="index.html">Главная</a></li>
            <li class="breadcrumb-item active" aria-current="page">Мероприятия</li>
          </ol>
        </nav>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <h1 class="h2 fw-bold mb-1">Каталог мероприятий</h1>
            <p class="text-body-secondary mb-0" id="resultsCount">Загрузка…</p>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button class="btn btn-outline-primary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#filtersPanel" aria-controls="filtersPanel">
              <i class="bi bi-sliders me-1"></i>Фильтры <span class="badge text-bg-primary ms-1 d-none" id="filtersCountBadge"></span>
            </button>
            <label class="visually-hidden" for="sortSelect">Сортировка</label>
            <select class="form-select" id="sortSelect" name="sort">
              <option value="date">Сначала ближайшие</option>
              <option value="popular">Сначала популярные</option>
              <option value="rating">По рейтингу</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="filtersPanel" aria-labelledby="filtersTitle">
            <div class="offcanvas-header border-bottom">
              <h2 class="offcanvas-title h5" id="filtersTitle">Фильтры</h2>
              <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filtersPanel" aria-label="Закрыть"></button>
            </div>
            <div class="offcanvas-body p-lg-0">
              <form class="card filters-card shadow-sm w-100" id="filtersForm" role="search">
                <div class="card-body">
                  <div class="mb-3">
                    <label class="form-label fw-semibold small" for="searchInput">Поиск</label>
                    <div class="input-group">
                      <span class="input-group-text bg-body"><i class="bi bi-search"></i></span>
                      <input class="form-control" type="search" id="searchInput" name="q" placeholder="Название или описание">
                    </div>
                  </div>

                  <fieldset class="mb-3">
                    <legend class="form-label fw-semibold small">Направление</legend>
                    <div class="d-flex flex-wrap gap-2 filter-chip-group" id="categoryFilter"></div>
                  </fieldset>

                  <fieldset class="mb-3">
                    <legend class="form-label fw-semibold small">Когда</legend>
                    <div class="d-flex flex-wrap gap-2 filter-chip-group mb-2" id="periodFilter">
                      <input type="radio" class="btn-check" name="period" id="periodAll" value="" checked>
                      <label class="btn btn-sm btn-outline-primary" for="periodAll">Любая дата</label>
                      <input type="radio" class="btn-check" name="period" id="periodToday" value="today">
                      <label class="btn btn-sm btn-outline-primary" for="periodToday">Сегодня</label>
                      <input type="radio" class="btn-check" name="period" id="periodWeek" value="week">
                      <label class="btn btn-sm btn-outline-primary" for="periodWeek">7 дней</label>
                      <input type="radio" class="btn-check" name="period" id="periodMonth" value="month">
                      <label class="btn btn-sm btn-outline-primary" for="periodMonth">30 дней</label>
                    </div>
                    <div class="row g-2">
                      <div class="col-6">
                        <label class="form-label small text-body-secondary mb-1" for="dateFrom">С</label>
                        <input class="form-control form-control-sm" type="date" id="dateFrom" name="date_from">
                      </div>
                      <div class="col-6">
                        <label class="form-label small text-body-secondary mb-1" for="dateTo">По</label>
                        <input class="form-control form-control-sm" type="date" id="dateTo" name="date_to">
                      </div>
                    </div>
                  </fieldset>

                  <div class="mb-3">
                    <label class="form-label fw-semibold small" for="facultySelect">Институт</label>
                    <select class="form-select form-select-sm" id="facultySelect" name="faculty_id">
                      <option value="">Все институты</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold small" for="tagSelect">Тег</label>
                    <select class="form-select form-select-sm" id="tagSelect" name="tag">
                      <option value="">Любой тег</option>
                    </select>
                  </div>

                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="onlyAvailable" name="only_available">
                    <label class="form-check-label small" for="onlyAvailable">Только со свободными местами</label>
                  </div>
                  <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="includePast" name="include_past">
                    <label class="form-check-label small" for="includePast">Показывать прошедшие</label>
                  </div>

                  <button class="btn btn-light w-100" type="reset" id="resetFilters"><i class="bi bi-arrow-counterclockwise me-1"></i>Сбросить фильтры</button>
                  <button class="btn btn-primary w-100 mt-2 d-lg-none" type="button" data-bs-dismiss="offcanvas" data-bs-target="#filtersPanel">Показать результаты</button>
                </div>
              </form>
            </div>
          </div>
        </aside>

        <section class="col-lg-9" aria-live="polite" aria-busy="false" id="resultsSection">
          <div class="active-filters d-flex flex-wrap gap-2 mb-3" id="activeFilters"></div>
          <div class="row g-4" id="eventsGrid"></div>
          <nav class="mt-4 d-flex justify-content-center" aria-label="Страницы каталога">
            <ul class="pagination" id="pagination"></ul>
          </nav>
        </section>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/events.js"></script>
</body>
</html>
